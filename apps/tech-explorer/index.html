  <script>
    // Desktop windows are often shorter than the 800px the slides are made for.
    // Scale the page down to fit, like pressing ⌘− once. Mouse devices only.
    (() => {
      const fine = matchMedia('(hover: hover) and (pointer: fine)');
      const fit = () => {
        const z = fine.matches && innerWidth >= 900 ? Math.max(0.75, Math.min(1, innerHeight / 800)) : 1;
        document.documentElement.style.zoom = z === 1 ? '' : z;
        document.documentElement.style.setProperty('--z', z);
      };
      fit();
      addEventListener('resize', fit);
    })();
  </script>
