<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport settings prevent auto-zooming on iOS when tapping things -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Only apply hover: styles on devices that can hover, so colors don't stick after a tap
        tailwind.config = { future: { hoverOnlyWhenSupported: true } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            /* 100dvh = the visible area, so Safari's toolbar can't cover the keypad (100vh is the fallback) */
            height: 100vh;
            height: 100dvh;
            /* Prevents pull-to-refresh on mobile */
            overscroll-behavior-y: contain; 
            touch-action: pan-x pan-y;
        }
        
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .correct-pop {
            animation: pop 0.3s ease-out forwards;
            color: #10B981 !important; /* Tailwind emerald-500 */
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* "9999 + 9999 =" wraps at the normal size, so 4-digit mode steps down one size */
        #question-display.long-question {
            font-size: 3rem; /* text-5xl */
            line-height: 1;
        }
        @media (min-width: 768px) {
            #question-display.long-question { font-size: 3.75rem; } /* text-6xl */
        }

        /* No gray tap flash, no text selection or callout on long-press */
        button {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Numpad active states for touch devices (pressed colors are per key via active:bg-*) */
        .numpad-btn:active {
            transform: scale(0.95);
        }

        /* Practice layout: question on top, keypad at the bottom */
        #practice-body {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas: "question" "numpad";
        }
        #question-area { grid-area: question; }
        #numpad { grid-area: numpad; }
        #scratch-pad { grid-area: scratch; display: none; }

        /* 3- and 4-digit modes put a scratch pad between the question and the keypad.
           Below this height (a phone in Safari) it would be a sliver too short to write in, so it stays off. */
        @media (min-height: 786px) {
            .with-scratch #practice-body {
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas: "question" "scratch" "numpad";
            }
            .with-scratch #scratch-pad {
                display: block;
                margin: 0 1rem 1rem;
            }
        }
        /* On a landscape tablet or computer, stacking leaves the pad too short, so it goes alongside */
        @media (min-width: 768px) and (min-height: 600px) and (orientation: landscape) {
            #app-container.with-scratch { max-width: 64rem; }
            .with-scratch #practice-body {
                grid-template-columns: 28rem minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto;
                grid-template-areas: "question scratch" "numpad scratch";
            }
            .with-scratch #scratch-pad {
                display: block;
                margin: 1rem 1rem max(1rem, env(safe-area-inset-bottom)) 0;
            }
        }

        #scratch-pad {
            background-color: #fff;
            /* Faint squares help line up digits in columns */
            background-image:
                linear-gradient(to right, #eef2f7 1px, transparent 1px),
                linear-gradient(to bottom, #eef2f7 1px, transparent 1px);
            background-size: 40px 40px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        /* The pad takes every touch, so drawing never scrolls or zooms the page */
        #scratch-canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans w-screen overflow-hidden flex justify-center items-center">

    <!-- App Container (Mobile optimized, constrained on desktop) -->
    <div id="app-container" class="w-full h-full max-w-md bg-white shadow-2xl relative flex flex-col overflow-hidden">
        
        <!-- MAIN MENU -->
        <div id="menu-screen" class="flex-1 w-full overflow-y-auto">
            <div class="min-h-full flex flex-col items-center justify-center p-6 space-y-4 py-8">
                <div class="text-center space-y-2 mb-4">
                    <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tight">Math Master</h1>
                    <p class="text-slate-500 font-medium">Select a practice mode</p>
                </div>

                <!-- Basic Addition Mode -->
                <button onclick="startPractice('add-2-9')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-transform active:scale-95 text-lg">
                    Basic Addition<br><span class="text-white text-base font-normal">Single digits (2 to 9)</span>
                </button>

                <!-- Addition/Sub 2-digit -->
                <button onclick="startPractice('add-sub-2')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-transform active:scale-95 text-lg">
                    Addition & Subtraction<br><span class="text-white text-base font-normal">Up to 2-digits (&lt; 99)</span>
                </button>
                
                <!-- Addition/Sub 3-digit -->
                <button onclick="startPractice('add-sub-3')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-transform active:scale-95 text-lg">
                    Addition & Subtraction<br><span class="text-white text-base font-normal">Up to 3-digits (&lt; 999)</span>
                </button>

                <!-- Addition/Sub 4-digit -->
                <button onclick="startPractice('add-sub-4')" class="w-full bg-fuchsia-700 hover:bg-fuchsia-800 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-transform active:scale-95 text-lg">
                    Addition & Subtraction<br><span class="text-white text-base font-normal">Up to 4-digits (&lt; 9999)</span>
                </button>

                <!-- Multiplication -->
                <button onclick="startPractice('mult-2-9')" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-transform active:scale-95 text-lg">
                    Multiplication<br><span class="text-white text-base font-normal">2 to 9 (with occasional ×10)</span>
                </button>
            </div>
        </div>

        <!-- PRACTICE SCREEN -->
        <div id="practice-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <!-- Header Status Bar -->
            <div class="flex justify-between items-center p-4 pt-[max(1rem,env(safe-area-inset-top))] bg-slate-50 border-b border-slate-200 shrink-0">
                <button onclick="goHome()" aria-label="Back to menu" class="text-slate-600 hover:text-slate-800 p-3 -ml-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                
                <div class="flex gap-2 md:gap-3 text-base font-bold text-slate-600">
                    <div class="flex items-center gap-1 bg-slate-200 px-3 py-1 rounded-full">
                        ⏱ <span id="timer-display">00:00</span>
                    </div>
                    <div class="flex items-center gap-1 bg-orange-100 text-orange-700 px-3 py-1 rounded-full">
                        🔥 <span id="streak-display">0</span>
                    </div>
                    <div class="flex items-center gap-1 bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">
                        ⭐ <span id="score-display">0</span>
                    </div>
                </div>
            </div>

            <!-- Time Bar & Status Display -->
            <div class="w-full shrink-0 bg-white border-b border-slate-100 flex flex-col">
                <div class="w-full bg-slate-200 h-2.5">
                    <div id="time-bar" class="h-2.5 w-full bg-green-500 transition-all duration-75"></div>

            <!-- Question, scratch pad and keypad (arranged by #practice-body in the stylesheet) -->
            <div id="practice-body">

            <!-- Question Area -->
            <div id="question-area" class="flex flex-col items-center justify-center p-4 overflow-y-auto">
                <div id="question-display" class="text-6xl md:text-7xl font-black text-slate-700 tracking-tighter transition-colors duration-300 text-center">
                    <!-- Question injected here -->
                </div>
                
                <div class="mt-4 md:mt-8 h-16 md:h-20 flex items-center justify-center">
                    <div id="user-input" class="text-5xl font-bold text-indigo-600 min-w-[3rem] text-center border-b-4 border-indigo-200 pb-2 transition-colors">
                        <!-- User input injected here -->
                    </div>
                </div>
            </div>

            <!-- Scratch Pad (3- and 4-digit modes): free writing space for working it out -->
            <div id="scratch-pad" class="relative rounded-2xl border-2 border-slate-200 overflow-hidden">
                <canvas id="scratch-canvas" class="absolute inset-0 w-full h-full"></canvas>
                <div id="scratch-hint" class="absolute inset-0 flex items-center justify-center text-slate-400 text-lg font-medium pointer-events-none">
                    ✏️ Work it out here
                </div>
                <button id="scratch-clear" onclick="clearScratch()" class="hidden absolute top-2 right-2 flex items-center gap-1 bg-white active:bg-slate-100 text-slate-600 text-base font-bold px-3 py-2 rounded-full border border-slate-200 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Clear
                </button>
            </div>

            <!-- Custom Numpad -->
            <div id="numpad" class="bg-slate-50 p-4 pb-[max(2rem,env(safe-area-inset-bottom))] md:pb-[max(1.5rem,env(safe-area-inset-bottom))] rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] shrink-0">
                <div class="grid grid-cols-3 gap-3 md:gap-4 max-w-sm mx-auto">
                    <!-- Numbers -->
                    <button onclick="appendNumber('1')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">1</button>
                    <button onclick="appendNumber('2')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">2</button>
                    <button onclick="appendNumber('3')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">3</button>
                    <button onclick="appendNumber('4')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">4</button>
                    <button onclick="appendNumber('5')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">5</button>
                    <button onclick="appendNumber('6')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">6</button>
                    <button onclick="appendNumber('7')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">7</button>
                    <button onclick="appendNumber('8')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">8</button>
                    <button onclick="appendNumber('9')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">9</button>
                    
                    <!-- Bottom Row -->
                    <button onclick="deleteNumber()" class="numpad-btn bg-red-50 active:bg-red-100 text-red-500 text-xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-red-100 flex justify-center items-center transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                        </svg>
                    </button>
                    <button onclick="appendNumber('0')" class="numpad-btn bg-white active:bg-gray-200 text-2xl font-bold py-3 md:py-4 rounded-xl shadow-sm border border-slate-200 transition-all">0</button>
                    <button onclick="submitAnswer()" class="numpad-btn bg-indigo-500 text-white text-xl font-bold py-3 md:py-4 rounded-xl shadow-sm hover:bg-indigo-600 active:bg-indigo-700 transition-all">
                        ENTER
                    </button>
                </div>
            </div>

            </div>
        </div>
    </div>

    <script>
        // State
        let currentMode = '';
        let currentAnswer = '';
        let expectedAnswer = 0;
        let score = 0;
        let streak = 0;
        let sessionSeconds = 0;
        let timerInterval = null;
        
        // Question Timing state
        let questionStartTime = 0;
        let questionTimerInterval = null;
        let isProcessing = false;
        let hasPenalizedCurrentQuestion = false;
        let wrongAttempts = 0;
        let feedbackTimeout = null; // Pending "next step" after feedback; cancelled on goHome
        let timeScale = 1; // 4-digit sums take longer, so that mode's time bar and speed bonus run 3x slower
        
        // History Trackers
        let lastThree = []; // Tracks actual displayed questions for adjacency rules
        let multHistory = []; // Tracks base combinations (2-9) to ensure all 64 are visited

        // Synth for Sound
        let synth;

        // Initialize Audio Engine
        async function initAudio() {
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.05, decay: 0.1, sustain: 0.2, release: 1 }
                }).toDestination();
                synth.volume.value = -8; // Comfortable volume
            }
        }

        function playJoyfulSound() {
            if (!synth) return;
            const now = Tone.now();
            synth.triggerAttackRelease("C5", "16n", now);
            synth.triggerAttackRelease("E5", "16n", now + 0.1);
            synth.triggerAttackRelease("G5", "8n", now + 0.2);
        }

        // Global Session Timer
        function startTimer() {
            sessionSeconds = 0;
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                sessionSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const m = Math.floor(sessionSeconds / 60).toString().padStart(2, '0');
            const s = (sessionSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }
        
        // Per-Question Countdown Timer
        function startQuestionTimer() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            questionStartTime = Date.now();
            updateTimeBar();
            // Update every 50ms for smooth bar depletion
            questionTimerInterval = setInterval(updateTimeBar, 50); 
        }

        function updateTimeBar() {
            // Note: intentionally removed `if (isProcessing) return;` 
            // so the timer continues to drain while answering incorrectly (anti-cheese)
            let elapsedMs = Date.now() - questionStartTime;
            let seconds = elapsedMs / 1000 / timeScale;
            
            // Calculate width, stopping at a minimum of 1.5%
            let remainingPercent = Math.max(100 - (seconds / 10) * 100, 1.5);
            
            let bar = document.getElementById('time-bar');
            let tierText = document.getElementById('tier-text');
            
            bar.style.width = `${remainingPercent}%`;
            
            // Adjust visual themes based on time tiers
            if (seconds <= 2.0) {
                bar.className = "h-2.5 w-full transition-all duration-75 bg-green-500";
                tierText.className = "text-green-700";
                tierText.innerText = "⚡ Super fast!";
            } else if (seconds <= 5.0) {
                bar.className = "h-2.5 w-full transition-all duration-75 bg-blue-400";
                tierText.className = "text-blue-700";
                tierText.innerText = "👍 Good pace";
            } else if (seconds <= 10.0) {
                bar.className = "h-2.5 w-full transition-all duration-75 bg-orange-400";
                tierText.className = "text-orange-700";
                tierText.innerText = "🐢 Take your time";
            } else {
                bar.className = "h-2.5 w-full transition-all duration-75 bg-red-500";
                tierText.className = "text-red-700";
                tierText.innerText = "💪 You can do it!";
            }
        }

        function startPractice(mode) {
            initAudio(); // Initialize audio context on user interaction
            currentMode = mode;
            score = 0;
            streak = 0;
            lastThree = [];
            multHistory = [];
            updateStats();
            timeScale = mode === 'add-sub-4' ? 3 : 1;
            document.getElementById('question-display').classList.toggle('long-question', mode === 'add-sub-4');
            document.getElementById('app-container').classList.toggle('with-scratch', SCRATCH_MODES.includes(mode));

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('practice-screen').classList.remove('hidden');
            
            startTimer();
            generateNewQuestion();
        }

        function goHome() {
            // One tap shouldn't silently throw away a round in progress
            if (score > 0 && !confirm('Leave this round? Your score will not be saved.')) return;
            stopTimer();
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            // Don't let a pending feedback step leak into the next session
            clearTimeout(feedbackTimeout);
            isProcessing = false;
            document.getElementById('app-container').classList.remove('with-scratch');
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('practice-screen').classList.add('hidden');
        }

        function isSimilarAddSub(q1, q2) {
            let c1 = Math.abs(q1.n1 - q2.n1) <= 2 && Math.abs(q1.n2 - q2.n2) <= 2;
            let c2 = Math.abs(q1.n1 - q2.n2) <= 2 && Math.abs(q1.n2 - q2.n1) <= 2;
            return c1 || c2;
        }

        function generateNewQuestion() {
            let n1, n2, operator;
            let baseN1, baseN2;
            let found = false;
            let attempts = 0;
            let maxRetries = 50;

            while (!found && attempts < maxRetries) {
                attempts++;

                // BASIC ADDITION (2 to 9)
                if (currentMode === 'add-2-9') {
                    n1 = Math.floor(Math.random() * 8) + 2; // 2 to 9
                    n2 = Math.floor(Math.random() * 8) + 2; // 2 to 9
                    operator = '+';
                    
                    let similar = false;
                    for (let prev of lastThree) {
                        if (prev.op === operator && isSimilarAddSub({n1, n2}, prev)) {
                            similar = true; break;
                        }
                    }
                    if (!similar || attempts === maxRetries) {
                        expectedAnswer = n1 + n2;
                        found = true;
                    }
                }

                // ADDITION & SUBTRACTION
                else if (currentMode.startsWith('add-sub-')) {
                    let digits = parseInt(currentMode.slice(-1)); // 2, 3 or 4
                    let max = 10 ** digits - 1;
                    let min = 10 ** (digits - 1);
                    
                    n1 = Math.floor(Math.random() * (max - min + 1)) + min;
                    n2 = Math.floor(Math.random() * (max - min + 1)) + min;
                    operator = Math.random() > 0.5 ? '+' : '-';
                    
                    if (operator === '-') {
                        if (n1 < n2) { let temp = n1; n1 = n2; n2 = temp; }
                    }
                    
                    let similar = false;
                    for (let prev of lastThree) {
                        if (prev.op === operator && isSimilarAddSub({n1, n2}, prev)) {
                            similar = true; break;
                        }
                    }
                    if (!similar || attempts === maxRetries) {
                        expectedAnswer = operator === '+' ? n1 + n2 : n1 - n2;
                        found = true;
                    }
                } 
                
                // MULTIPLICATION
                else if (currentMode === 'mult-2-9') {
                    let validOptions = [];
                    
                    // 1. Generate all valid options evaluating adjacency rules
                    for (let i = 2; i <= 9; i++) {
                        for (let j = 2; j <= 9; j++) {
                            let isBad = false;
                            
                            // Rule: Avoid exact/swapped in last 3
                            for (let prev of lastThree) {
                                if (prev.op === '×') {
                                    if ((prev.baseN1 === i && prev.baseN2 === j) ||
                                        (prev.baseN1 === j && prev.baseN2 === i)) {
                                        isBad = true; break;
                                    }
                                }
                            }
                            if (isBad) continue;
                            
                            // Rule: Adjacent question cannot have diff <= 1 for bases
                            if (lastThree.length > 0) {
                                let adj = lastThree[lastThree.length - 1];
                                if (adj.op === '×') {
                                    let c1 = Math.abs(i - adj.baseN1) <= 1 && Math.abs(j - adj.baseN2) <= 1;
                                    let c2 = Math.abs(i - adj.baseN2) <= 1 && Math.abs(j - adj.baseN1) <= 1;
                                    if (c1 || c2) isBad = true;
                                }
                            }
                            
                            if (!isBad) validOptions.push({n1: i, n2: j});
                        }
                    }
                    
                    // Fallback if rules were too strict
                    if (validOptions.length === 0) {
                        for(let i=2; i<=9; i++) for(let j=2; j<=9; j++) validOptions.push({n1:i, n2:j});
                    }
                    
                    // 2. Prioritize unseen combinations from the 64-history
                    let unseen = validOptions.filter(opt => {
                        return !multHistory.some(hist => 
                            (hist.n1 === opt.n1 && hist.n2 === opt.n2) || 
                            (hist.n1 === opt.n2 && hist.n2 === opt.n1)
                        );
                    });
                    
                    let selectedOpt;
                    if (unseen.length > 0) {
                        selectedOpt = unseen[Math.floor(Math.random() * unseen.length)];
                    } else {
                        selectedOpt = validOptions[0];
                        let oldestIndex = 999999;
                        for (let opt of validOptions) {
                            let idx = multHistory.findIndex(h => 
                                (h.n1===opt.n1 && h.n2===opt.n2) || 
                                (h.n1===opt.n2 && h.n2===opt.n1)
                            );
                            if (idx < oldestIndex) {
                                oldestIndex = idx;
                                selectedOpt = opt;
                            }
                        }
                    }
                    
                    baseN1 = selectedOpt.n1;
                    baseN2 = selectedOpt.n2;

                    // 3. Random modifiers based on requested probabilities
                    let rand = Math.random();
                    
                    if (rand < 0.04) {
                        // 4% chance BOTH * 10
                        n1 = baseN1 * 10;
                        n2 = baseN2 * 10;
                    } else if (rand < 0.165) {
                        // 12.5% chance n1 * 10
                        n1 = baseN1 * 10;
                        n2 = baseN2;
                    } else if (rand < 0.29) {
                        // 12.5% chance n2 * 10
                        n1 = baseN1;
                        n2 = baseN2 * 10;
                    } else {
                        // 71% chance NEITHER (Basic 2-9)
                        n1 = baseN1;
                        n2 = baseN2;
                    }

                    operator = '×';
                    expectedAnswer = n1 * n2;
                    found = true;
                }
            }

            // Track History
            lastThree.push({ n1, n2, op: operator, baseN1: baseN1 || n1, baseN2: baseN2 || n2 });
            if (lastThree.length > 3) lastThree.shift();
            
            if (currentMode === 'mult-2-9') {
                multHistory.push({ n1: baseN1, n2: baseN2 });
                if (multHistory.length > 64) multHistory.shift();
            }

            // Reset Penalty Tracker for the new question
            hasPenalizedCurrentQuestion = false;
            wrongAttempts = 0;
            clearScratch();

            // Update UI & Start Question Timer
            currentAnswer = '';
            document.getElementById('question-display').innerText = `${n1} ${operator} ${n2} = `;
            document.getElementById('question-display').classList.remove('correct-pop', 'text-red-500');
            document.getElementById('question-display').classList.add('text-slate-700');
            updateInputDisplay();
            startQuestionTimer();
        }

        function appendNumber(num) {
            if (isProcessing) return;
            if (currentAnswer.length < 5) {
                currentAnswer += num;
                updateInputDisplay();
            }
        }

        function deleteNumber() {
            if (isProcessing) return;
            currentAnswer = currentAnswer.slice(0, -1);
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const display = document.getElementById('user-input');
            display.innerText = currentAnswer || '?';
            display.classList.remove('text-red-500', 'text-emerald-500', 'text-slate-500', 'shake');
            
            if (!currentAnswer) {
                display.classList.add('text-slate-300');
                display.classList.remove('text-indigo-600');
            } else {
                display.classList.remove('text-slate-300');
                display.classList.add('text-indigo-600');
            }
        }

        function updateStats() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('streak-display').innerText = streak;
        }

        function submitAnswer() {
            if (isProcessing || currentAnswer === '') return;
            isProcessing = true;

            const qDisplay = document.getElementById('question-display');
            const iDisplay = document.getElementById('user-input');
            
            let elapsed = (Date.now() - questionStartTime) / 1000 / timeScale;

            if (parseInt(currentAnswer) === expectedAnswer) {
                // Correct - Stop Timer!
                if (questionTimerInterval) clearInterval(questionTimerInterval);
                
                // Determine score multiplier based on elapsed time
                let basePoints = 10 + (streak * 2);
                let earned = basePoints;
                
                if (elapsed <= 2.0) earned = Math.round(basePoints * 1.2);
                else if (elapsed <= 5.0) earned = basePoints;
                else if (elapsed <= 10.0) earned = Math.round(basePoints * 0.9);
                else earned = Math.round(basePoints * 0.8);

                // Add earned points
                score += earned;
                streak += 1;
                updateStats();
                
                playJoyfulSound();
                
                qDisplay.classList.add('correct-pop');
                iDisplay.classList.add('text-emerald-500');
                iDisplay.classList.remove('text-indigo-600');

                feedbackTimeout = setTimeout(() => {
                    isProcessing = false;
                    generateNewQuestion();
                }, 800);
            } else {
                // Incorrect - Timer keeps running while user gets feedback!
                wrongAttempts++;
                
                // Apply penalty only ONCE per question
                if (!hasPenalizedCurrentQuestion) {
                    streak = 0;
                    score = Math.max(0, score - 5);
                    updateStats();
                    hasPenalizedCurrentQuestion = true;
                }

                // Swap (not stack) color classes: the stylesheet order would otherwise decide the winner
                qDisplay.classList.remove('text-slate-700');
                qDisplay.classList.add('text-red-500');
                iDisplay.classList.add('text-red-500', 'shake');
                iDisplay.classList.remove('text-indigo-600');

                // Second miss: show the answer and move on instead of leaving them stuck guessing
                if (wrongAttempts >= 2) {
                    if (questionTimerInterval) clearInterval(questionTimerInterval);
                    feedbackTimeout = setTimeout(showAnswer, 600);
                    return;
                }

                feedbackTimeout = setTimeout(() => {
                    isProcessing = false;
                    currentAnswer = ''; // Clear answer to let them try again
                    updateInputDisplay();
                    qDisplay.classList.remove('text-red-500');
                    qDisplay.classList.add('text-slate-700');
                }, 600);
            }
        }

        function showAnswer() {
            const qDisplay = document.getElementById('question-display');
            const iDisplay = document.getElementById('user-input');

            qDisplay.classList.remove('text-red-500');
            qDisplay.classList.add('text-slate-700');
            iDisplay.innerText = expectedAnswer;
            iDisplay.classList.remove('text-red-500', 'shake');
            iDisplay.classList.add('text-slate-500');

            feedbackTimeout = setTimeout(() => {
                isProcessing = false;
                generateNewQuestion();
            }, 1500);
        }

        // Scratch Pad (3- and 4-digit modes): write with a finger or Apple Pencil.
        // Strokes are kept as points so a resize or rotation can redraw them.
        const SCRATCH_MODES = ['add-sub-3', 'add-sub-4'];
        const scratchCanvas = document.getElementById('scratch-canvas');
        const scratchCtx = scratchCanvas.getContext('2d');
        let scratchStrokes = [];
        let activeStroke = null;
        let activePointerId = null;
        let canvasRect = null;
        let penSeen = false; // After an Apple Pencil draws, ignore fingers so a resting palm can't scribble

        function resizeScratch() {
            const dpr = window.devicePixelRatio || 1;
            const rect = scratchCanvas.getBoundingClientRect();
            scratchCanvas.width = Math.round(rect.width * dpr);
            scratchCanvas.height = Math.round(rect.height * dpr);
            // Resizing resets the context, so the pen settings go back on every time
            scratchCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            scratchCtx.lineWidth = 3;
            scratchCtx.lineCap = 'round';
            scratchCtx.lineJoin = 'round';
            scratchCtx.strokeStyle = scratchCtx.fillStyle = '#334155'; // slate-700
            for (const stroke of scratchStrokes) drawStroke(stroke);
        }

        // Draws a stroke from point `from` onward; a stroke of one point is a dot
        function drawStroke(stroke, from = 1) {
            scratchCtx.beginPath();
            if (stroke.length === 1) {
                scratchCtx.arc(stroke[0].x, stroke[0].y, scratchCtx.lineWidth / 2, 0, Math.PI * 2);
                scratchCtx.fill();
                return;
            }
            scratchCtx.moveTo(stroke[from - 1].x, stroke[from - 1].y);
            for (let i = from; i < stroke.length; i++) scratchCtx.lineTo(stroke[i].x, stroke[i].y);
            scratchCtx.stroke();
        }

        function scratchPoint(e) {
            return { x: e.clientX - canvasRect.left, y: e.clientY - canvasRect.top };
        }

        function clearScratch() {
            scratchStrokes = [];
            activeStroke = null; // A stroke in progress stops here; the next touch starts a new one
            scratchCtx.save();
            scratchCtx.setTransform(1, 0, 0, 1, 0, 0);
            scratchCtx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);
            scratchCtx.restore();
            updateScratchControls();
        }

        // The hint shows on an empty pad, the Clear button once there's something to clear
        function updateScratchControls() {
            const empty = scratchStrokes.length === 0;
            document.getElementById('scratch-hint').classList.toggle('hidden', !empty);
            document.getElementById('scratch-clear').classList.toggle('hidden', empty);
        }

        scratchCanvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'pen') penSeen = true;
            else if (e.pointerType === 'touch' && penSeen) return;
            if (activePointerId !== null) return; // One stroke at a time: a second finger doesn't draw
            activePointerId = e.pointerId;
            scratchCanvas.setPointerCapture(e.pointerId);
            canvasRect = scratchCanvas.getBoundingClientRect();
            activeStroke = [scratchPoint(e)];
            scratchStrokes.push(activeStroke);
            drawStroke(activeStroke);
            updateScratchControls();
        });

        scratchCanvas.addEventListener('pointermove', (e) => {
            if (e.pointerId !== activePointerId || !activeStroke) return;
            const from = activeStroke.length;
            // Coalesced events carry every sample between frames, so fast Pencil strokes stay smooth
            const samples = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
            for (const s of (samples.length ? samples : [e])) activeStroke.push(scratchPoint(s));
            drawStroke(activeStroke, from);
        });

        function endStroke(e) {
            if (e.pointerId !== activePointerId) return;
            activePointerId = null;
            activeStroke = null;
        }
        scratchCanvas.addEventListener('pointerup', endStroke);
        scratchCanvas.addEventListener('pointercancel', endStroke);

        new ResizeObserver(resizeScratch).observe(scratchCanvas);

        // iOS Safari only applies :active styles when the page listens for touches
        document.addEventListener('touchstart', () => {}, { passive: true });

        // Hardware keyboard support for desktop/macbook users
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('practice-screen').classList.contains('hidden')) return;
            
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === 'Backspace') {
                deleteNumber();
            } else if (e.key === 'Enter') {
                submitAnswer();
            }
        });
    </script>
</body>
</html>
